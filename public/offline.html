<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Koneksi Terputus - WillowWallet</title>
    <!-- Tailwind via CSS stylesheet or plain clean inline style with high-fidelity visual design -->
    <style>
      :root {
        --color-bg: #060B18;
        --color-surface: #0B1224;
        --color-primary: #128E64;
        --color-primary-hover: #0E714F;
        --color-text-primary: #F8FAFC;
        --color-text-secondary: #94A3B8;
        --color-border: rgba(232, 237, 244, 0.1);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      body {
        background-color: var(--color-bg);
        color: var(--color-text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        text-align: center;
      }
      .card {
        background-color: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 24px;
        padding: 2.5rem 2rem;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .logo-container {
        position: relative;
        width: 80px;
        height: 80px;
        margin-bottom: 1.5rem;
      }
      .logo-icon {
        width: 100%;
        height: 100%;
        background-color: var(--color-primary);
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 16px rgba(18, 142, 100, 0.3);
      }
      .logo-icon svg {
        width: 44px;
        height: 44px;
        fill: #FFFFFF;
      }
      .badge-wifi {
        position: absolute;
        bottom: -4px;
        right: -4px;
        background-color: #EF4444;
        color: white;
        border-radius: 50%;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        border: 3px solid var(--color-surface);
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      }
      h1 {
        font-size: 1.35rem;
        font-weight: 700;
        margin-bottom: 0.75rem;
        letter-spacing: -0.02em;
        color: var(--color-text-primary);
      }
      p {
        font-size: 0.875rem;
        color: var(--color-text-secondary);
        line-height: 1.5;
        margin-bottom: 2rem;
        max-width: 320px;
      }
      .btn {
        background-color: var(--color-primary);
        color: #FFFFFF;
        font-size: 0.875rem;
        font-weight: 600;
        border: none;
        border-radius: 12px;
        padding: 0.75rem 2rem;
        cursor: pointer;
        transition: all 0.2s ease;
        width: 100%;
        box-shadow: 0 4px 12px rgba(18, 142, 100, 0.2);
      }
      .btn:hover {
        background-color: var(--color-primary-hover);
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(18, 142, 100, 0.3);
      }
      .btn:active {
        transform: translateY(1px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo-container">
        <div class="logo-icon">
          <!-- Svg W matching our logo -->
          <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <path d="M 150,135 L 205,135 L 245,290 L 256,250 L 267,290 L 307,135 L 362,135 L 295,365 L 217,365 Z" />
          </svg>
        </div>
        <div class="badge-wifi">📶</div>
      </div>
      
      <h1>Koneksi Terputus</h1>
      <p>Tidak ada koneksi internet. Data Anda tetap aman secara lokal dan akan disinkronkan kembali ketika koneksi tersedia.</p>
      
      <button class="btn" onclick="tryAgain()">Coba Lagi</button>
    </div>

    <script>
      function tryAgain() {
        if (navigator.onLine) {
          window.location.href = '/';
        } else {
          // Pulse the button to show we checked
          const btn = document.querySelector('.btn');
          btn.style.opacity = '0.5';
          setTimeout(() => {
            btn.style.opacity = '1';
          }, 300);
        }
      }

      // Check automatically when connection is restored
      window.addEventListener('online', () => {
        window.location.href = '/';
      });
    </script>
  </body>
</html>

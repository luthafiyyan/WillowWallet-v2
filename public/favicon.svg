<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#128E64" />
      <stop offset="100%" stop-color="#0A5037" />
    </linearGradient>
    
    <!-- Coin Gradient -->
    <linearGradient id="coin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="50%" stop-color="#FFC72C" />
      <stop offset="100%" stop-color="#D99B00" />
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>
    
    <!-- Shadows -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#032116" flood-opacity="0.35" />
    </filter>
    <filter id="coin-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#032116" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="116" fill="url(#bg-grad)" />

  <!-- Willow Leaves Background Pattern (Left Side) -->
  <g fill="url(#leaf-grad)">
    <!-- Branch Stem -->
    <path d="M 50,400 C 50,300 75,200 135,120 C 138,116 132,112 129,116 C 69,196 40,300 40,400 Z" opacity="0.3" />
    <!-- Leaves -->
    <path d="M 120,140 C 90,120 65,130 45,155 C 70,165 100,160 120,140 Z" />
    <path d="M 100,190 C 65,175 40,190 20,220 C 47,228 80,215 100,190 Z" />
    <path d="M 90,250 C 55,240 30,260 15,295 C 40,298 70,280 90,250 Z" />
    <path d="M 85,310 C 50,310 30,335 20,375 C 43,370 70,345 85,310 Z" />
    <!-- Right side branch leaf accents -->
    <path d="M 130,170 C 150,150 165,165 175,190 C 153,192 137,182 130,170 Z" />
    <path d="M 110,225 C 130,205 145,220 155,245 C 133,247 117,237 110,225 Z" />
  </g>

  <!-- The Letter "W" (Shifted up to accommodate text) -->
  <path d="M 150,135 
           L 205,135 
           L 245,290 
           L 256,250 
           L 267,290 
           L 307,135 
           L 362,135 
           L 295,365 
           L 217,365 Z" 
        fill="#FFFFFF" 
        filter="url(#drop-shadow)" />

  <!-- Gold Coin Overlapping W (Shifted up to match W) -->
  <g filter="url(#coin-shadow)">
    <!-- Outer gold ring -->
    <circle cx="355" cy="120" r="72" fill="url(#coin-grad)" />
    <!-- Inner coin ridge -->
    <circle cx="355" cy="120" r="60" fill="none" stroke="#E59A08" stroke-width="3.5" opacity="0.8" />
    <circle cx="355" cy="120" r="58" fill="none" stroke="#FFE97F" stroke-width="1.5" opacity="0.5" />
    
    <!-- Dollar Sign inside Coin -->
    <text font-family="'Inter', system-ui, -apple-system, sans-serif" 
          font-size="84" 
          font-weight="900" 
          fill="#A36600" 
          x="355" 
          y="150" 
          text-anchor="middle" 
          opacity="0.95">
      $
    </text>
    <!-- Highlight dollar sign overlay -->
    <text font-family="'Inter', system-ui, -apple-system, sans-serif" 
          font-size="84" 
          font-weight="900" 
          fill="#FFE475" 
          x="353" 
          y="148" 
          text-anchor="middle">
      $
    </text>
  </g>

  <!-- Willow Wallet Text at the Bottom -->
  <text font-family="'Inter', system-ui, -apple-system, sans-serif" 
        font-size="44" 
        font-weight="700" 
        fill="#FFFFFF" 
        x="256" 
        y="442" 
        text-anchor="middle"
        letter-spacing="-0.5">
    Willow Wallet
  </text>
</svg>

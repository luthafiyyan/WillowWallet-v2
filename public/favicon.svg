<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#128A61" />
      <stop offset="100%" stop-color="#0E5A3E" />
    </linearGradient>
    
    <!-- Coin Gradient -->
    <linearGradient id="coin-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885" />
      <stop offset="50%" stop-color="#FFC72C" />
      <stop offset="100%" stop-color="#D99B00" />
    </linearGradient>

    <!-- Leaf Gradient -->
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    
    <!-- Shadow for W and Coin -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#05261A" flood-opacity="0.4" />
    </filter>
    <filter id="coin-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#05261A" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />

  <!-- Willow Leaves Background Patterns (Left Side) -->
  <g fill="url(#leaf-grad)">
    <!-- Branch Stem -->
    <path d="M 60,420 C 60,320 80,220 140,140 C 143,136 137,132 134,136 C 74,216 50,320 50,420 Z" opacity="0.4" />
    <!-- Leaf 1 -->
    <path d="M 125,160 C 95,140 70,150 50,175 C 75,185 105,180 125,160 Z" />
    <!-- Leaf 2 -->
    <path d="M 105,210 C 70,195 45,210 25,240 C 52,248 85,235 105,210 Z" />
    <!-- Leaf 3 -->
    <path d="M 95,270 C 60,260 35,280 20,315 C 45,318 75,300 95,270 Z" />
    <!-- Leaf 4 -->
    <path d="M 90,330 C 55,330 35,355 25,395 C 48,390 75,365 90,330 Z" />
    <!-- Right side branch leaf accents -->
    <path d="M 135,190 C 155,170 170,185 180,210 C 158,212 142,202 135,190 Z" />
    <path d="M 115,245 C 135,225 150,240 160,265 C 138,267 122,257 115,245 Z" />
  </g>

  <!-- The Letter "W" -->
  <path d="M 150,170 
           L 205,170 
           L 245,325 
           L 256,285 
           L 267,325 
           L 307,170 
           L 362,170 
           L 295,400 
           L 217,400 Z" 
        fill="#F8FAFC" 
        filter="url(#drop-shadow)" />

  <!-- Gold Coin Overlapping W -->
  <g filter="url(#coin-shadow)">
    <!-- Outer gold ring -->
    <circle cx="360" cy="155" r="75" fill="url(#coin-grad)" />
    <!-- Inner coin ridge -->
    <circle cx="360" cy="155" r="63" fill="none" stroke="#F1A80A" stroke-width="4" opacity="0.8" />
    <circle cx="360" cy="155" r="61" fill="none" stroke="#FFE97F" stroke-width="2" opacity="0.5" />
    
    <!-- Dollar Sign inside Coin -->
    <text font-family="'Inter', system-ui, -apple-system, sans-serif" 
          font-size="88" 
          font-weight="900" 
          fill="#B37400" 
          x="360" 
          y="186" 
          text-anchor="middle" 
          opacity="0.95">
      $
    </text>
    <!-- Highlight dollar sign overlay -->
    <text font-family="'Inter', system-ui, -apple-system, sans-serif" 
          font-size="88" 
          font-weight="900" 
          fill="#FFE67F" 
          x="358" 
          y="184" 
          text-anchor="middle">
      $
    </text>
  </g>
</svg>
